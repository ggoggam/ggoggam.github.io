<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/icon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="theme-color"
      content="#f5f5f2"
      media="(prefers-color-scheme: light)"
      data-scheme="light"
    />
    <meta
      name="theme-color"
      content="#141615"
      media="(prefers-color-scheme: dark)"
      data-scheme="dark"
    />

    <script>
      // Applied before first paint, so a stored theme never flashes the system
      // one first. Kept in step with applyThemePref() in src/lib/theme.ts.
      (function () {
        try {
          var pref = localStorage.getItem("theme");
          if (pref !== "light" && pref !== "dark") return;
          document.documentElement.setAttribute("data-theme", pref);
          var metas = document.querySelectorAll("meta[name='theme-color']");
          for (var i = 0; i < metas.length; i++) {
            metas[i].media = metas[i].dataset.scheme === pref ? "all" : "not all";
          }
        } catch (e) {
          /* a blocked localStorage just leaves the system theme in place */
        }
      })();
    </script>
    <meta name="google-adsense-account" content="ca-pub-7271700485488471" />
    <meta name="google-site-verification" content="UTWiNkqBKoQ9bKTbvn4ZoCauup-ir0AfRY64Gfc2RoM" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Pretendard is bundled locally. Only Geist Mono loads from Google. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400..600&display=swap"
    />

    <script>
      // GitHub Pages SPA redirect handler
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
    <title>꼬깜</title>
  </head>
  <body>
    <!-- The notebook's visual direction and interaction rules live in DESIGN.md. -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
